name: 致美化 Daily Check-in

on:
  schedule:
    - cron: '0 0 * * *'  # 每天UTC 00:00运行，即北京时间08:00
  workflow_dispatch:  # 允许手动触发

jobs:
  checkin:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Run 致美化 check-in
      env:
        zmh: ${{ secrets.ZMH_CREDENTIALS }}  # 设置环境变量，使用GitHub Secrets存储凭据
      run: node 致美化.js
